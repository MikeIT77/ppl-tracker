<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPL Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0d0f; --surface:#161618; --surface2:#1e1e21; --surface3:#252528;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#f0f0f0; --muted:#777;
  --accent:#e8ff47; --accent2:#47ffce;
  --red:#ff4a4a;
  --fd:'Bebas Neue',sans-serif; --fb:'DM Sans',sans-serif; --fm:'DM Mono',monospace;
  --r:10px; --rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100vh;}
.nav{display:flex;gap:2px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;align-items:center;}
.nav-logo{font-family:var(--fd);font-size:22px;letter-spacing:1px;color:var(--red);margin-right:12px;line-height:34px;}
.nav-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:4px;background:rgba(255,74,74,0.12);color:var(--red);letter-spacing:1px;margin-right:auto;}
.nav-btn{padding:5px 10px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-family:var(--fb);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover{color:var(--text);background:var(--surface2);}
.nav-btn.active{background:var(--surface2);color:var(--accent);border:1px solid rgba(232,255,71,0.2);}
.nav-user{font-size:11px;color:var(--muted);margin-left:10px;}
.page{display:none;padding:14px;max-width:800px;margin:0 auto;}
.page.active{display:block;}
.page-title{font-family:var(--fd);font-size:32px;letter-spacing:1px;margin-bottom:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.form-group label{display:block;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.form-group input,.form-group select{width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:var(--fm);font-size:13px;outline:none;transition:border-color 0.15s;}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);}
.form-group input::placeholder{color:#3a3a3a;}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
.btn{padding:8px 16px;border-radius:7px;border:none;font-family:var(--fb);font-size:13px;font-weight:700;cursor:pointer;transition:opacity 0.15s;}
.btn:hover{opacity:0.85;}
.btn-accent{background:var(--accent);color:#000;}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--muted);}
.btn-outline:hover{color:var(--text);}
.btn-red{background:rgba(255,74,74,0.12);color:var(--red);border:1px solid rgba(255,74,74,0.2);}
.btn-red:hover{background:rgba(255,74,74,0.2);}
.btn-full{width:100%;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:6px 10px;font-weight:600;}
td{padding:11px 10px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle;}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:0.5px;}
.tag-admin{background:rgba(255,74,74,0.12);color:var(--red);}
.tag-user{background:rgba(71,184,255,0.12);color:#47b8ff;}
.tag-global{background:rgba(232,255,71,0.1);color:var(--accent);}
.tag-personal{background:rgba(71,184,255,0.1);color:#47b8ff;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px;}
.empty{text-align:center;padding:28px;color:var(--muted);font-size:13px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--accent);color:#000;padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px;z-index:999;transition:transform 0.25s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* Login */
#admin-login{display:none;position:fixed;inset:0;background:#0d0d0f;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9999;}
#admin-login input{padding:11px 16px;border-radius:9px;border:1px solid #333;background:#1e1e21;color:#f0f0f0;font-size:15px;width:270px;outline:none;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="admin-login">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--red);letter-spacing:2px;">ADMIN</div>
  <p style="color:#777;font-size:13px;">Admin access only</p>
  <input id="a-username" type="text" placeholder="Username" autocomplete="username"
    onkeydown="if(event.key==='Enter')document.getElementById('a-password').focus()">
  <input id="a-password" type="password" placeholder="Password" autocomplete="current-password"
    onkeydown="if(event.key==='Enter')adminLogin()">
  <button onclick="adminLogin()" style="padding:10px 28px;border-radius:9px;border:none;background:var(--red);color:#fff;font-weight:700;font-size:14px;cursor:pointer;width:270px;">
    Sign In
  </button>
  <p id="a-error" style="color:#ff4a4a;font-size:12px;display:none;">Invalid credentials or insufficient role</p>
</div>

<nav class="nav" id="admin-nav" style="display:none;">
  <span class="nav-logo">PPL</span>
  <span class="nav-tag">ADMIN</span>
  <button class="nav-btn active" onclick="showAdminPage('plans',this)">Plans</button>
  <button class="nav-btn" onclick="showAdminPage('exercises',this)">Exercises</button>
  <button class="nav-btn" onclick="showAdminPage('users',this)">Users</button>
  <span class="nav-user" id="a-nav-user"></span>
  <button class="btn btn-outline" onclick="adminLogout()" style="margin-left:10px;padding:4px 12px;font-size:11px;">Log Out</button>
</nav>

<!-- PLANS PAGE -->
<div id="apage-plans" class="page">
  <p class="page-title">GLOBAL PLANS</p>

  <div class="card">
    <div class="card-title">Create Global Plan</div>
    <div class="form-group" style="margin-bottom:10px;">
      <label>Plan Name</label>
      <input type="text" id="a-plan-name" placeholder="e.g. Push A">
    </div>
    <div id="a-plan-exercises" style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;"></div>
    <button onclick="aAddExRow()" class="btn btn-outline btn-full" style="margin-bottom:10px;">+ Add Exercise</button>
    <button onclick="aCreatePlan()" class="btn btn-accent btn-full">Create Global Plan</button>
  </div>

  <div class="card-title" style="padding:0 2px;margin-bottom:8px;">Existing Global Plans</div>
  <div id="a-plans-list"></div>
</div>

<!-- EXERCISES PAGE -->
<div id="apage-exercises" class="page">
  <p class="page-title">EXERCISE LIBRARY</p>

  <div class="card">
    <div class="card-title">Add Global Exercise</div>
    <div class="form-row-2" style="margin-bottom:10px;">
      <div class="form-group"><label>Exercise Name</label><input type="text" id="a-ex-name" placeholder="e.g. Cable Fly"></div>
      <div class="form-group"><label>Category</label>
        <select id="a-ex-cat" style="color-scheme:dark;">
          <option value="Weight Training">Weight Training</option>
          <option value="Cardio">Cardio</option>
        </select>
      </div>
    </div>
    <button onclick="aCreateExercise()" class="btn btn-accent btn-full">Add Exercise</button>
  </div>

  <div class="card-title" style="padding:0 2px;margin-bottom:8px;">Global Exercises</div>
  <div id="a-ex-list"></div>
</div>

<!-- USERS PAGE -->
<div id="apage-users" class="page">
  <p class="page-title">USER MANAGEMENT</p>

  <div class="card">
    <div class="card-title">Create User</div>
    <div class="form-row-3" style="margin-bottom:10px;">
      <div class="form-group"><label>Username</label><input type="text" id="a-new-username" placeholder="Jane Smith"></div>
      <div class="form-group"><label>Password</label><input type="password" id="a-new-password" placeholder="temp password"></div>
      <div class="form-group"><label>Role</label>
        <select id="a-new-role" style="color-scheme:dark;">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <button onclick="aCreateUser()" class="btn btn-accent btn-full">Create User</button>
  </div>

  <div class="card-title" style="padding:0 2px;margin-bottom:8px;">All Users</div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Username</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody id="a-users-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Change password modal -->
  <div id="a-pw-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:600;align-items:center;justify-content:center;">
    <div style="background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:20px;width:320px;">
      <p style="font-family:var(--fd);font-size:22px;margin-bottom:12px;">CHANGE PASSWORD</p>
      <p id="a-pw-modal-user" style="font-size:13px;color:var(--muted);margin-bottom:12px;"></p>
      <div class="form-group" style="margin-bottom:12px;">
        <label>New Password</label>
        <input type="password" id="a-pw-new" placeholder="New password">
      </div>
      <div style="display:flex;gap:8px;">
        <button onclick="closePasswordModal()" class="btn btn-outline" style="flex:1;">Cancel</button>
        <button onclick="confirmPasswordChange()" class="btn btn-accent" style="flex:2;">Save Password</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = '';
let adminToken = '';
let pendingPasswordUserId = null;

function getAdminToken() { return localStorage.getItem('ppl_admin_jwt') || ''; }
function setAdminToken(t) { localStorage.setItem('ppl_admin_jwt', t); }
function clearAdminToken(){ localStorage.removeItem('ppl_admin_jwt'); localStorage.removeItem('ppl_admin_user'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function apiFetch(path, options={}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+getAdminToken(), ...(options.headers||{}) },
    body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
  });
  if(res.status === 401) { adminLogout(); throw new Error('Unauthorized'); }
  if(!res.ok) { const err = await res.json().catch(()=>{}); throw new Error((err&&err.detail)||'API error'); }
  return res.json();
}

async function adminLogin() {
  const username = document.getElementById('a-username').value.trim();
  const password = document.getElementById('a-password').value.trim();
  try {
    const data = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    }).then(r=>r.ok?r.json():Promise.reject());
    if(data.role !== 'admin') { document.getElementById('a-error').style.display='block'; return; }
    setAdminToken(data.token);
    localStorage.setItem('ppl_admin_user', data.username);
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-nav').style.display = 'flex';
    document.getElementById('a-nav-user').textContent = data.username;
    showAdminPage('plans', document.querySelector('.nav-btn.active'));
  } catch(e) {
    document.getElementById('a-error').style.display = 'block';
  }
}

function adminLogout() {
  clearAdminToken();
  document.getElementById('admin-nav').style.display = 'none';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('admin-login').style.display = 'flex';
}

function showAdminPage(id, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('apage-'+id).classList.add('active');
  if(btn) btn.classList.add('active');
  if(id==='plans')     loadPlans();
  if(id==='exercises') loadExercises();
  if(id==='users')     loadUsers();
}

// ─── PLANS ─────────────────────────────────────────
let adminPlanExRows = [];

function aAddExRow(name='', sets='', reps='') {
  const wrap = document.getElementById('a-plan-exercises');
  const row = document.createElement('div');
  row.style.cssText = 'display:grid;grid-template-columns:1fr 70px 70px 34px;gap:6px;align-items:center;';
  row.innerHTML = `
    <input type="text" placeholder="Exercise name" value="${name}"
      style="padding:8px 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:13px;font-family:var(--fm);outline:none;">
    <input type="number" placeholder="Sets" value="${sets}" min="1"
      style="padding:8px 6px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:13px;font-family:var(--fm);outline:none;text-align:center;">
    <input type="number" placeholder="Reps" value="${reps}" min="1"
      style="padding:8px 6px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:13px;font-family:var(--fm);outline:none;text-align:center;">
    <button onclick="this.parentElement.remove()" class="btn btn-red" style="padding:5px 6px;font-size:13px;">✕</button>`;
  wrap.appendChild(row);
}

function getAdminPlanExercises() {
  const wrap = document.getElementById('a-plan-exercises');
  return Array.from(wrap.children).map(row => {
    const inputs = row.querySelectorAll('input');
    return { name: inputs[0].value.trim(), sets: parseInt(inputs[1].value)||null, reps: parseInt(inputs[2].value)||null };
  }).filter(e=>e.name);
}

async function aCreatePlan() {
  const name = document.getElementById('a-plan-name').value.trim();
  if(!name) { showToast('Enter a plan name'); return; }
  const exercises = getAdminPlanExercises();
  try {
    await apiFetch('/api/plans', {method:'POST', body:{name, is_global:true, exercises}});
    document.getElementById('a-plan-name').value = '';
    document.getElementById('a-plan-exercises').innerHTML = '';
    showToast('Global plan created');
    loadPlans();
  } catch(e) { showToast('Error: '+e.message); }
}

async function aDeletePlan(id) {
  if(!confirm('Delete this plan?')) return;
  await apiFetch(`/api/plans/${id}`, {method:'DELETE'});
  loadPlans();
}

async function loadPlans() {
  const plans = await apiFetch('/api/plans');
  const el = document.getElementById('a-plans-list');
  const global = plans.filter(p=>p.is_global);
  if(!global.length) { el.innerHTML='<div class="empty">No global plans yet</div>'; return; }
  el.innerHTML = '';
  global.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginBottom = '10px';
    const exercises = p.exercises.length
      ? p.exercises.map(e=>`<div style="font-size:12px;color:var(--muted);font-family:var(--fm);padding:2px 0;">${e.name}${e.sets?` — ${e.sets}×${e.reps||'?'} reps`:''}</div>`).join('')
      : '<div style="font-size:12px;color:var(--muted);">No exercises</div>';
    card.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <span style="font-weight:600;font-size:14px;">${p.name} <span class="tag tag-global">GLOBAL</span></span>
        <button onclick="aDeletePlan(${p.id})" class="btn btn-red" style="padding:4px 9px;font-size:11px;">Delete</button>
      </div>
      <div>${exercises}</div>`;
    el.appendChild(card);
  });
}

// ─── EXERCISES ─────────────────────────────────────
async function aCreateExercise() {
  const name = document.getElementById('a-ex-name').value.trim();
  const cat  = document.getElementById('a-ex-cat').value;
  if(!name) { showToast('Enter a name'); return; }
  try {
    await apiFetch(`/api/library/${encodeURIComponent(name)}`, {method:'POST', body:{category:cat}});
    document.getElementById('a-ex-name').value = '';
    showToast('Exercise added');
    loadExercises();
  } catch(e) { showToast('Error: '+e.message); }
}

async function aDeleteExercise(name) {
  if(!confirm(`Delete "${name}"?`)) return;
  await apiFetch(`/api/library/${encodeURIComponent(name)}`, {method:'DELETE'});
  loadExercises();
}

async function loadExercises() {
  const lib = await apiFetch('/api/library');
  const el  = document.getElementById('a-ex-list');
  const global = Object.entries(lib).filter(([,v])=>v.is_global);
  if(!global.length) { el.innerHTML='<div class="empty">No global exercises</div>'; return; }
  el.innerHTML = `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Exercise</th><th>Category</th><th></th></tr></thead>
    <tbody>${global.map(([name,v])=>`
      <tr>
        <td style="font-weight:500;">${name}</td>
        <td><span class="tag tag-global">${v.category}</span></td>
        <td style="text-align:right;"><button onclick="aDeleteExercise('${name.replace(/'/g,"\\'")}')" class="btn btn-red" style="padding:3px 9px;font-size:11px;">Delete</button></td>
      </tr>`).join('')}
    </tbody></table></div></div>`;
}

// ─── USERS ─────────────────────────────────────────
async function aCreateUser() {
  const username = document.getElementById('a-new-username').value.trim();
  const password = document.getElementById('a-new-password').value.trim();
  const role     = document.getElementById('a-new-role').value;
  if(!username||!password) { showToast('Fill in all fields'); return; }
  try {
    await apiFetch('/api/admin/users', {method:'POST', body:{username, password, role}});
    document.getElementById('a-new-username').value = '';
    document.getElementById('a-new-password').value = '';
    showToast('User created');
    loadUsers();
  } catch(e) { showToast('Error: '+e.message); }
}

async function loadUsers() {
  const users = await apiFetch('/api/admin/users');
  const tbody = document.getElementById('a-users-tbody');
  tbody.innerHTML = users.map(u=>`
    <tr>
      <td style="font-weight:500;">${u.username}</td>
      <td><span class="tag ${u.role==='admin'?'tag-admin':'tag-user'}">${u.role.toUpperCase()}</span></td>
      <td style="font-size:12px;color:var(--muted);">${u.created_at?u.created_at.split('T')[0]:''}</td>
      <td style="text-align:right;">
        <button onclick="openPasswordModal(${u.id},'${u.username.replace(/'/g,"\\'")}')" class="btn btn-outline" style="padding:3px 9px;font-size:11px;margin-right:4px;">Change PW</button>
        <button onclick="aDeleteUser(${u.id})" class="btn btn-red" style="padding:3px 9px;font-size:11px;">Delete</button>
      </td>
    </tr>`).join('');
}

function openPasswordModal(uid, username) {
  pendingPasswordUserId = uid;
  document.getElementById('a-pw-modal-user').textContent = `Changing password for: ${username}`;
  document.getElementById('a-pw-new').value = '';
  document.getElementById('a-pw-modal').style.display = 'flex';
}

function closePasswordModal() {
  document.getElementById('a-pw-modal').style.display = 'none';
  pendingPasswordUserId = null;
}

async function confirmPasswordChange() {
  const pw = document.getElementById('a-pw-new').value.trim();
  if(!pw) { showToast('Enter a password'); return; }
  try {
    await apiFetch(`/api/admin/users/${pendingPasswordUserId}/password`, {
      method:'PUT', body:{user_id: pendingPasswordUserId, new_password: pw}
    });
    closePasswordModal();
    showToast('Password updated');
  } catch(e) { showToast('Error: '+e.message); }
}

async function aDeleteUser(uid) {
  if(!confirm('Delete this user and all their data?')) return;
  try {
    await apiFetch(`/api/admin/users/${uid}`, {method:'DELETE'});
    showToast('User deleted');
    loadUsers();
  } catch(e) { showToast('Error: '+e.message); }
}

// ─── INIT ──────────────────────────────────────────
function init() {
  const token = getAdminToken();
  const user  = localStorage.getItem('ppl_admin_user');
  if(token && user) {
    // Verify token is still valid
    fetch('/api/auth/me', {headers:{'Authorization':'Bearer '+token}})
      .then(r=>r.json())
      .then(data=>{
        if(data.role!=='admin') { adminLogout(); return; }
        document.getElementById('admin-login').style.display = 'none';
        document.getElementById('admin-nav').style.display   = 'flex';
        document.getElementById('a-nav-user').textContent    = data.username;
        showAdminPage('plans', document.querySelector('.nav-btn'));
      })
      .catch(()=>adminLogout());
  } else {
    document.getElementById('admin-login').style.display = 'flex';
  }
}
init();
</script>
</body>
</html>
